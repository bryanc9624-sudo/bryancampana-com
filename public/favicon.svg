<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BC">
  <style>
    .bg { fill: #141414; }
    .fg { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #f2f2f2; }
      .fg { fill: #101010; }
    }
  </style>
  <rect class="bg" width="64" height="64" />
  <text class="fg" x="32" y="33" text-anchor="middle" dominant-baseline="central"
        font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="600"
        letter-spacing="-1">BC</text>
</svg>
