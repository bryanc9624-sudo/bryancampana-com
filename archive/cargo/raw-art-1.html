u003cbr />\n\u003cspan class=\"heading-5\">\u003ca href=\"590-madison-ave\">590 Madison Ave\u003c/a>\u003c/span>\u003cbr />\n\u003cspan class=\"selected-work-text\">ADA and wayfinding package for an amenity floor. Materials drawn from the interior architecture.\u003c/span>\u003cbr />\n\u003c/column-unit>\u003ccolumn-unit class=\"selected-work-item\" slot=\"1\">\u003ca class=\"image-link\" href=\"big-city-volleyball\">\u003cmedia-item class=\"selected-work-image\" disable-zoom=\"\" hash=\"D2626315014783907043757713294159\">\u003c/media-item>\u003c/a>\u003cbr />\n\u003cspan class=\"heading-5\">\u003ca href=\"big-city-volleyball\">Big City Volleyball\u003c/a>\u003c/span>\u003cbr />\n\u003cspan class=\"selected-work-text\">Logo and brand system for an established New York club.\u003c/span>\u003cbr />\n\u003c/column-unit>\u003ccolumn-unit class=\"selected-work-item\" slot=\"2\">\u003ca class=\"image-link\" href=\"togethereffect\">\u003cmedia-item class=\"selected-work-image\" disable-zoom=\"\" hash=\"P1982856117592546452836439327567\">\u003c/media-item>\u003c/a>\u003cbr />\n\u003cspan class=\"heading-5\">\u003ca href=\"togethereffect\">TogetherEffect\u003c/a>\u003c/span>\u003cbr />\n\u003cspan class=\"selected-work-text\">Identity and custom wordmark for a Brooklyn DJ collective.\u003c/span>\u003cbr />\n\u003c/column-unit>\u003c/column-set>\n\n\u003cbr />\n\n\u003ccolumn-set gutter=\"1.5rem\" mobile-stack=\"true\">\u003ccolumn-unit class=\"selected-work-item\" slot=\"0\">\u003ca class=\"image-link\" href=\"dura-architectural-signage\">\u003cmedia-item class=\"selected-work-image\" disable-zoom=\"\" hash=\"N2626457563751177321320233337679\">\u003c/media-item>\u003c/a>\u003cbr />\n\u003cspan class=\"heading-5\">\u003ca href=\"dura-architectural-signage\">Dura Architectural Signage\u003c/a>\u003c/span>\u003cbr />\n\u003cspan class=\"selected-work-text\">Design intent, shop drawings, and documentation standards at a signage fabricator.\u003c/span>\u003cbr />\n\u003c/column-u =\"W1981237565753661014867080414031\">\u003c/media-item>\n\n\n\n\n\n\n\n\n\n\n\n\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"3\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"6\">\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"3\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"6\">\n\n\u003cdiv>\u003cdiv style=\"text-align: left;\">\n\n\n\n\n\n\n\u003ci>Transmute\u003c/i> explores how systems evolve through instability. Corruption is a mirror for living within a toxic or broken environment. Survival means reshaping what exists. Its environment suggests both a digital space and an organic mind, yet resists being pinned to either. \n\nThe work asks how new futures emerge from what’s been damaged, and whether growth can happen without distortion\n\n\n\n\u003cbr />\n\n\u003cbr />\nThe video traces a brief passage through three levels, where the player’s acts of repair unfold less as victory than as dialogue.\u003cbr />\n\n\n\n\n\u003c/div>\u003c/div>\n\n\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"3\">\n\n\u003ci>\u003c/i>\n\n\n\n\n\u003cbr />\n\n\n\n\n\n\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"3\">\n\n\u003cdiv>\u003cdiv style=\"text-align: left;\">\u003cdiv class=\"two-col\">\u003chr />\u003cspan class=\"small-heading\">Completed\u003c/span>\u003cspan class=\"small\">2018\n\u003cbr />\n\n\n\u003c/span>\u003cspan class=\"small-heading\">Medium\u003c/span>\u003cbr />\n\u003cspan class=\"small\">Unity based digital game\u003c/span>\u003cspan class=\"small-heading\">Discipline\u003c/span>\u003cspan class=\"small\">New Media\u003c/span>\u003c/div>\u003c/div>\u003c/div>\n\n\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"3\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"6\">\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"3\">\u003c/column-unit>\u003c/column-set>","local_css":null,"display":tr mn-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"6\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"3\">\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"3\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"6\">\n\n\u003ci>Memory Strip\u003c/i> explores the intimate connection between body movements and sensory information. This piece combines close-up shots of various body parts in motion, such as the throat, eye, and chest, creating a dynamic visual strip that represents the brain&#x27;s sensory processing. The video invites viewers to experience the interplay of physical movement, observation, emotions, and desires, as if they were observing these sensations from a flipped perspective, from the inside.\n\n\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"3\">\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"3\">\n\n\u003cdiv>\u003cdiv style=\"text-align: left;\">\u003cdiv class=\"two-col\">\u003chr />\u003cspan class=\"small-heading\">Completed\u003c/span>\u003cspan class=\"small\">2019\n\u003cbr />\n\n\n\u003c/span>\u003cspan class=\"small-heading\">Medium\u003c/span>\u003cbr />\n\u003cspan class=\"small\">Video, Color, Sound, 03.25 min.\u003c/span>\u003cspan class=\"small-heading\">Discipline\u003c/span>\u003cspan class=\"small\">New Media\u003c/span>\u003c/div>\u003c/div>\u003c/div>\n\n\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\">\u003c/column-unit>\u003c/column-set>","local_css":null,"display":true,"stack":false,"pin":false,"overlay":false,"password_enabled":false,"page_count":null,"page_design_options":null,"backdrops":{"activeBackdrop":"none"},"pin_options":{},"overlay_options":{},"thumb_media_id":42762999,"thumbnail":{"id":42762999,"master_muid":14189
