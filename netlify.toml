[build]
  command = "npm run build"
  publish = "dist"

  # Deploy discipline (see DECISIONS.md, 2026-09-07 — Deploy gate was inverted).
  # The Personal plan is 1,000 credits per cycle and a build costs 15, so the
  # cycle buys about 65 builds. (It was 300 on the free tier; corrected 2026-09-07
  # against the billing page -- see D-060.) A build runs ONLY when the commit
  # SUBJECT STARTS WITH the deploy tag. Exit 0 = skip. Exit non-zero = run it.
  #
  # %s is the subject line ONLY — deliberately not %B. %B includes the body, and
  # commit bodies discuss this rule; a body reading "not deploying, no tag" used
  # to match itself and fire the build. That cost 19 unintended builds and a full
  # billing cycle on 2026-09-07. The ^ anchor is the other half of the fix: a
  # subject merely mentioning the tag must not trigger either.
  #
  # $COMMIT_REF is the commit Netlify is deploying, which it sets itself. Naming it
  # is deliberate: `git log -1` alone reads whatever HEAD happens to be in the build
  # container, which is an assumption about their checkout rather than something we
  # control. ${COMMIT_REF:-HEAD} keeps the command working when it is unset, which is
  # how it behaves when run by hand in this repo.
  #
  # Check what the current commit would do, before pushing:
  #   git log -1 --pretty=%s | grep -q "^\[deploy\]" && echo BUILD || echo skip
  ignore = 'git log -1 --pretty=%s "${COMMIT_REF:-HEAD}" | grep -q "^\[deploy\]" && exit 1 || exit 0'

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
